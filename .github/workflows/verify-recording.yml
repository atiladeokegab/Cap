name: Recording fixture (Windows)

# The fork's real-Windows fixture for the film pipeline (tests/sync and ingest
# there): one short studio take of cap-verify-stimulus, recorded through Cap's
# real Studio pipeline on a GitHub-hosted windows-2022 runner while a script
# clicks the stimulus with SendInput, kept as an artifact. Each click flips a
# corner patch on the stimulus, logged with its host time and the time the
# changed picture was presented in <stimulus log>.clicks.jsonl. Dispatch only: the
# upstream PR/nightly matrix runs on Blacksmith runners this fork does not have.
#
# The take is recorded by the cap-verify recording oracle
# (crates/verify/tests/recording.rs), which writes <scratch>/recording.cap and
# keeps it with CAP_VERIFY_KEEP=1. No bucket, key or host appears here: the
# mirror step (added once the upload mirror merges) reads them from an Actions
# secret.
on:
  workflow_dispatch:
    inputs:
      case_filter:
        description: "Studio case to record"
        default: "recording/studio-screen/fragmented"

permissions:
  contents: read

concurrency:
  group: recording-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-windows:
    name: studio fixture (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CAP_VERIFY_CAPTURE: display
      CAP_VERIFY_REQUIRE_CAPTURE: "1"
      CAP_VERIFY_TIER: fast
      CAP_VERIFY_CASE: ${{ inputs.case_filter }}
      CAP_VERIFY_KEEP: "1"
      CAP_VERIFY_SCRATCH: ${{ github.workspace }}/verify-scratch
      CAP_VERIFY_REPORT_DIR: ${{ github.workspace }}/verify-report
      CAP_VERIFY_DUMP: ${{ github.workspace }}/verify-dump
      CAP_VERIFY_HOST: github-hosted
      CAP_VERIFY_STIMULUS_AUDIO: "0"
      CLICKS_DIR: ${{ github.workspace }}/clicks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-pc-windows-msvc
          tier: fast

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile ci-verify -p cap-verify-stimulus
          cargo test --locked --profile ci-verify -p cap-verify --test recording --no-run

      # Real input, not a synthetic event: user32 SendInput clicks at the centre
      # of the primary display, where the fullscreen stimulus is, every 500 ms
      # until the recording step finishes. Each click's host time goes to
      # clicks.jsonl so the film repo can line it up with cursor.json.
      - name: Start SendInput clicker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:CLICKS_DIR | Out-Null
          $script = @'
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Clicker {
            [StructLayout(LayoutKind.Sequential)] struct MOUSEINPUT { public int dx, dy; public uint data, flags, time; public IntPtr extra; }
            [StructLayout(LayoutKind.Sequential)] struct INPUT { public uint type; public MOUSEINPUT mi; }
            [DllImport("user32.dll", SetLastError = true)] static extern uint SendInput(uint n, INPUT[] inputs, int size);
            static uint Send(uint flags, int x, int y) {
              var inputs = new INPUT[1];
              inputs[0].type = 0; inputs[0].mi.dx = x; inputs[0].mi.dy = y; inputs[0].mi.flags = flags;
              return SendInput(1, inputs, Marshal.SizeOf(typeof(INPUT)));
            }
            // Cap's cursor recorder polls every 16 ms: hold the button 60 ms so each press is seen, and
            // step the position (0..65535 space, near the centre) so moves are recorded too.
            public static uint Click(int step) {
              int x = 32768 + (step % 5 - 2) * 1500, y = 32768;
              uint sent = Send(0x8001, x, y);  // MOVE | ABSOLUTE
              System.Threading.Thread.Sleep(30);
              sent += Send(0x0002, x, y);      // LEFTDOWN
              System.Threading.Thread.Sleep(60);
              return sent + Send(0x0004, x, y); // LEFTUP
            }
          }
          "@
          $out = Join-Path $env:CLICKS_DIR 'clicks.jsonl'
          $stop = Join-Path $env:CLICKS_DIR 'stop'
          $deadline = (Get-Date).AddMinutes(30)
          $step = 0
          while (-not (Test-Path $stop) -and (Get-Date) -lt $deadline) {
            $step++
            $sent = [Clicker]::Click($step)
            $ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            Add-Content $out ('{"unix_ms":' + $ms + ',"sent":' + $sent + '}')
            Start-Sleep -Milliseconds 500
          }
          '@
          Set-Content (Join-Path $env:CLICKS_DIR 'clicker.ps1') $script
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', (Join-Path $env:CLICKS_DIR 'clicker.ps1') -WindowStyle Hidden

      - name: Record studio take
        shell: bash
        run: cargo test --locked --profile ci-verify -p cap-verify --test recording -- --nocapture

      - name: Stop clicker and list the take
        if: always()
        shell: bash
        run: |
          touch "$CLICKS_DIR/stop"
          sleep 1
          echo "clicks sent: $(wc -l < "$CLICKS_DIR/clicks.jsonl" 2>/dev/null || echo 0)"
          find "$CAP_VERIFY_SCRATCH" -path '*recording.cap/*' -type f | head -50

      - name: Upload take
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recording-fixture-windows-2022
          path: |
            ${{ github.workspace }}/verify-scratch/**/recording.cap
            ${{ github.workspace }}/verify-scratch/**/*.clicks.jsonl
            ${{ github.workspace }}/clicks/clicks.jsonl
            ${{ github.workspace }}/verify-report
          if-no-files-found: error
