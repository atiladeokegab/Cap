name: Recording fixture (Windows)

# The fork's real-Windows fixture for the film pipeline (tests/sync and ingest
# there): one short studio take of cap-verify-stimulus, recorded through Cap's
# real Studio pipeline on a GitHub-hosted windows-2022 runner while a script
# clicks the stimulus with SendInput, kept as an artifact. Each click flips a
# corner patch on the stimulus, logged with its host time and the time the
# changed picture was presented in <stimulus log>.clicks.jsonl. Dispatch only: the
# upstream PR/nightly matrix runs on Blacksmith runners this fork does not have.
#
# The take is recorded by the cap-verify recording oracle
# (crates/verify/tests/recording.rs), which writes <scratch>/recording.cap and
# keeps it with CAP_VERIFY_KEEP=1. The fork steps run only on a ref that has
# their code (an integration branch): the window log polls the real foreground
# window during the take, the teleprompter's shot logic writes shots.json into
# the take, `cap events` reads it back, and the upload mirror sends it to the
# bucket. No bucket, key or host appears here: the mirror reads its config from
# the CAP_MIRROR_CONFIG Actions secret and is skipped without it.
on:
  workflow_dispatch:
    inputs:
      case_filter:
        description: "Studio case to record"
        default: "recording/studio-screen/fragmented"

permissions:
  contents: read

concurrency:
  group: recording-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-windows:
    name: studio fixture (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CAP_VERIFY_CAPTURE: display
      CAP_VERIFY_REQUIRE_CAPTURE: "1"
      CAP_VERIFY_TIER: fast
      CAP_VERIFY_CASE: ${{ inputs.case_filter }}
      CAP_VERIFY_KEEP: "1"
      CAP_VERIFY_SCRATCH: ${{ github.workspace }}/verify-scratch
      CAP_VERIFY_REPORT_DIR: ${{ github.workspace }}/verify-report
      CAP_VERIFY_DUMP: ${{ github.workspace }}/verify-dump
      CAP_VERIFY_HOST: github-hosted
      CAP_VERIFY_STIMULUS_AUDIO: "0"
      CLICKS_DIR: ${{ github.workspace }}/clicks
      FORK_DIR: ${{ github.workspace }}/fork
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-pc-windows-msvc
          tier: fast

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile ci-verify -p cap-verify-stimulus
          cargo test --locked --profile ci-verify -p cap-verify --test recording --no-run

      # Fork tools, each only where its code is on this ref.
      - name: Build fork tools
        shell: bash
        run: |
          mkdir -p "$FORK_DIR"
          if [ -f apps/desktop-gpui/src/window_log.rs ]; then
            cargo build --locked --profile ci-verify -p cap-verify-stimulus --features window-log --bin window-log-probe
            echo "FORK_WINDOW_LOG=1" >> "$GITHUB_ENV"
          fi
          # cap-driver needs no gpui, but inside apps/desktop-gpui cargo loads that
          # workspace's patch to a local zed-cap checkout CI does not have. Build a
          # copy as its own workspace, shots.rs where its #[path] expects it.
          if [ -f apps/desktop-gpui/gcs-mirror/src/bin/cap-driver.rs ]; then
            driver="$RUNNER_TEMP/driver"
            mkdir -p "$driver/src"
            cp -r apps/desktop-gpui/gcs-mirror "$driver/"
            cp apps/desktop-gpui/src/shots.rs "$driver/src/"
            cp apps/desktop-gpui/Cargo.lock "$driver/gcs-mirror/"
            printf '\n[workspace]\n' >> "$driver/gcs-mirror/Cargo.toml"
            cargo build --release --manifest-path "$driver/gcs-mirror/Cargo.toml" --bin cap-driver
            echo "FORK_DRIVER=$(cd "$driver/gcs-mirror/target/release" && pwd)/cap-driver.exe" >> "$GITHUB_ENV"
          fi
          if [ -f apps/cli/src/events.rs ]; then
            cargo build --locked --profile ci-verify -p cap
            echo "FORK_EVENTS=1" >> "$GITHUB_ENV"
          fi

      # Real input, not a synthetic event: user32 SendInput clicks the lower left
      # of the primary display, inside the fullscreen stimulus, every 500 ms
      # until the recording step finishes. Each click's host time goes to
      # clicks.jsonl so the film repo can line it up with cursor.json.
      - name: Start SendInput clicker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:CLICKS_DIR | Out-Null
          $script = @'
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Clicker {
            [StructLayout(LayoutKind.Sequential)] struct MOUSEINPUT { public int dx, dy; public uint data, flags, time; public IntPtr extra; }
            [StructLayout(LayoutKind.Sequential)] struct INPUT { public uint type; public MOUSEINPUT mi; }
            [DllImport("user32.dll", SetLastError = true)] static extern uint SendInput(uint n, INPUT[] inputs, int size);
            static uint Send(uint flags, int x, int y) {
              var inputs = new INPUT[1];
              inputs[0].type = 0; inputs[0].mi.dx = x; inputs[0].mi.dy = y; inputs[0].mi.flags = flags;
              return SendInput(1, inputs, Marshal.SizeOf(typeof(INPUT)));
            }
            // Cap's cursor recorder polls every 16 ms: hold the button 60 ms so each press is seen, and
            // step the position (0..65535 space) so moves are recorded too. Lower left, clear of the
            // centred code marker and the corner patch: Cap draws the cursor into the export.
            public static uint Click(int step) {
              int x = 13107 + (step % 5 - 2) * 1500, y = 52428;
              uint sent = Send(0x8001, x, y);  // MOVE | ABSOLUTE
              System.Threading.Thread.Sleep(30);
              sent += Send(0x0002, x, y);      // LEFTDOWN
              System.Threading.Thread.Sleep(60);
              return sent + Send(0x0004, x, y); // LEFTUP
            }
          }
          "@
          $out = Join-Path $env:CLICKS_DIR 'clicks.jsonl'
          $stop = Join-Path $env:CLICKS_DIR 'stop'
          $deadline = (Get-Date).AddMinutes(30)
          $step = 0
          while (-not (Test-Path $stop) -and (Get-Date) -lt $deadline) {
            $step++
            $sent = [Clicker]::Click($step)
            $ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            Add-Content $out ('{"unix_ms":' + $ms + ',"sent":' + $sent + '}')
            Start-Sleep -Milliseconds 500
          }
          '@
          Set-Content (Join-Path $env:CLICKS_DIR 'clicker.ps1') $script
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', (Join-Path $env:CLICKS_DIR 'clicker.ps1') -WindowStyle Hidden

      # The fork's window log (window_log.rs, compiled in unchanged) on the real
      # desktop for the whole take, into fork/windows.jsonl. Its clock starts at
      # fork/window-log-epoch.json (unix ms), not the take's start gate: the take
      # is recorded by cap-verify, not the app.
      - name: Start window log
        if: env.FORK_WINDOW_LOG == '1'
        shell: pwsh
        run: |
          $probe = Get-ChildItem target -Recurse -Filter window-log-probe.exe | Select-Object -First 1
          Start-Process $probe.FullName -ArgumentList $env:FORK_DIR, (Join-Path $env:CLICKS_DIR 'stop') -WindowStyle Hidden

      - name: Record studio take
        shell: bash
        run: cargo test --locked --profile ci-verify -p cap-verify --test recording -- --nocapture

      - name: Stop clicker and list the take
        if: always()
        shell: bash
        run: |
          touch "$CLICKS_DIR/stop"
          sleep 1
          echo "clicks sent: $(wc -l < "$CLICKS_DIR/clicks.jsonl" 2>/dev/null || echo 0)"
          find "$CAP_VERIFY_SCRATCH" -path '*recording.cap/*' -type f | head -50
          echo "window log lines: $(wc -l < "$FORK_DIR/windows.jsonl" 2>/dev/null || echo 0)"

      # The teleprompter's shot logic (shots.rs through cap-driver) on the real
      # take folder: Next, Retake, Next on an injected clock, as a presenter would
      # press them, so the take gets the shots.json the film pipeline reads.
      - name: Shot marks
        if: env.FORK_DRIVER != ''
        shell: bash
        run: |
          take=$(find "$CAP_VERIFY_SCRATCH" -type d -name recording.cap | head -1)
          jq -n --arg take "$take" '{op: "shots", take: $take, epoch_ms: 0,
            shotlist: {shots: [
              {shot_id: "intro", title: "Intro", lines: [{sentence_id: "s1", text: "This is the fixture take."}]},
              {shot_id: "demo", title: "Demo", lines: [{sentence_id: "s2", text: "Each click flips the corner."}]},
              {shot_id: "ask", title: "Ask", lines: [{sentence_id: "s3", text: "That is the whole take."}]}]},
            script: [{action: "next", at_ms: 2000}, {action: "retake", at_ms: 3000}, {action: "next", at_ms: 4000}]}' \
            | "$FORK_DRIVER" | tee "$FORK_DIR/shots-result.json"
          cat "$take/shots.json"

      - name: cap events
        if: env.FORK_EVENTS == '1'
        shell: bash
        run: |
          take=$(find "$CAP_VERIFY_SCRATCH" -type d -name recording.cap | head -1)
          cap=$(find target -name cap.exe -path '*ci-verify*' | head -1)
          "$cap" events "$take" --json > "$FORK_DIR/events.json"
          jq 'length' "$FORK_DIR/events.json"

      # Uploads the finished take as the mirror does at stop, under
      # ci/<run>-<attempt>/, never takes/: the film loop watches takes/ and would cut
      # a CI take into a film. The config comes only from the secret, is
      # written to the runner's temp folder and never printed.
      - name: Mirror the take
        if: env.FORK_DRIVER != ''
        shell: bash
        env:
          CAP_MIRROR_CONFIG: ${{ secrets.CAP_MIRROR_CONFIG }}
        run: |
          if [ -z "$CAP_MIRROR_CONFIG" ]; then
            echo "CAP_MIRROR_CONFIG is not set; mirror skipped"
            exit 0
          fi
          config="$RUNNER_TEMP/mirror.json"
          trap 'rm -f "$config"' EXIT
          prefix="ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$CAP_MIRROR_CONFIG" | jq --arg p "$prefix" '.prefix = $p' > "$config"
          # Driver errors carry the bucket path and endpoint; Actions masks only the whole secret.
          for value in "$(jq -r '.bucket // empty' "$config")" "$(jq -r '.endpoint // empty' "$config" | sed -E 's#^[a-z]+://##; s#[/:].*##')"; do
            [ -n "$value" ] && echo "::add-mask::$value"
          done
          take=$(find "$CAP_VERIFY_SCRATCH" -type d -name recording.cap | head -1)
          outbox="$RUNNER_TEMP/outbox"
          jq -n --arg c "$config" --arg t "$take" --arg o "$outbox" '{op: "scan", config: $c, take: $t, outbox: $o}' \
            | "$FORK_DRIVER"
          jq -n --arg c "$config" --arg t "$take" --arg o "$outbox" --argjson now "$(date +%s%3N)" \
            '{op: "stop", config: $c, take: $t, outbox: $o, stopped_at_unix_ms: $now, drain_timeout_ms: 120000}' \
            | "$FORK_DRIVER" > "$RUNNER_TEMP/mirror-result.json"
          jq . "$RUNNER_TEMP/mirror-result.json"
          # The mirror's ledger lists each accepted PUT in order: keys only, never the bucket.
          jq -r --arg p "$prefix" '"PUT \($p)/\(.key) \(.size)"' "$outbox/uploaded.jsonl"
          jq -e '.drained == true' "$RUNNER_TEMP/mirror-result.json" > /dev/null

      - name: Upload take
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recording-fixture-windows-2022
          path: |
            ${{ github.workspace }}/verify-scratch/**/recording.cap
            ${{ github.workspace }}/verify-scratch/**/*.clicks.jsonl
            ${{ github.workspace }}/clicks/clicks.jsonl
            ${{ github.workspace }}/fork
            ${{ github.workspace }}/verify-report
          if-no-files-found: error
