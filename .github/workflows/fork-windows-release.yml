name: "fork-windows-release"

# Unsigned Windows NSIS installer for this fork. Cut down from
# desktop-release.yml's Windows leg: no SignPath, CrabNebula, Discord, Turbo,
# Apple or Tauri updater signing, and no repository secrets at all.
# workflow_dispatch uploads the installer as a workflow artifact; a v* tag
# also attaches it to a GitHub Release.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-build
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fork-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      TARGET: x86_64-pc-windows-msvc
      CAP_BUNDLE: apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-fork-rust-release
          save-cache: true
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target

      - uses: ./.github/actions/setup-js

      - name: Create .env file in root
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "RUST_TARGET_TRIPLE=$TARGET"
          } >> .env

      - name: Run cap-setup
        shell: bash
        run: bun run cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Check cap-recording
        shell: bash
        run: cargo check --locked -p cap-recording --target "$TARGET"

      - name: Test cap-gcs-mirror
        shell: bash
        run: cargo test --locked --manifest-path apps/desktop-gpui/Cargo.toml -p cap-gcs-mirror --target "$TARGET"

      - name: Build desktop binaries
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: ./scripts/build-desktop-binaries.sh "$TARGET"

      # The final link can exhaust commit on the 16GB runner; see desktop-release.yml.
      - name: Increase pagefile size
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Build Cap and bundle the NSIS installer
        shell: bash
        run: node scripts/bundle-gpui.mjs "$TARGET" --bundles nsis
        env:
          CI: false
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Verify Windows installer contents
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "$env:CAP_BUNDLE/nsis" -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows NSIS installer, found $($installers.Count)."
          }
          $sevenZip = Get-Command 7z -ErrorAction Stop
          $requiredFiles = @(
            "Cap.exe", "cap-muxer.exe", "cap-cli.exe",
            "avcodec-61.dll", "avdevice-61.dll", "avfilter-10.dll", "avformat-61.dll",
            "avutil-59.dll", "postproc-58.dll", "swresample-5.dll", "swscale-8.dll",
            "dxcompiler.dll", "dxil.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll"
          )
          $forbiddenFiles = @("cap-gpui.exe", "cap-exporter.exe")
          $contents = & $sevenZip.Source l -slt $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect '$($installers[0].Name)'." }
          foreach ($file in $requiredFiles) {
            if ($contents -notcontains "Path = $file") { throw "Installer is missing '$file'." }
          }
          foreach ($file in $forbiddenFiles) {
            if ($contents -contains "Path = $file") { throw "Installer unexpectedly bundles '$file'." }
          }
          "Installer: $($installers[0].Name) ($([math]::Round($installers[0].Length / 1MB, 1)) MB)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cap-windows-x64-unsigned
          path: ${{ env.CAP_BUNDLE }}/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$CAP_BUNDLE"/nsis/*.exe --title "$GITHUB_REF_NAME" --notes "Unsigned Windows installer." --verify-tag
