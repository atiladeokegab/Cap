name: Probe no-frame

on:
  push:
    branches: [ci/probe-noframe]

permissions:
  contents: read

jobs:
  avfbench:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-15, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify/avfbench
      - name: ffmpeg
        run: command -v ffmpeg || brew install ffmpeg >/dev/null
      - name: AVAssetReader idle vs CPU burn
        run: bash scripts/verify/avfbench/run.sh "$RUNNER_TEMP/avf"
